name: depurador-visual

services:
  app:
    image: depurador-visual:local
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      APP_KEY: ${APP_KEY:?Define APP_KEY en .env.docker}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_HTTP_PORT:-8080}:80"
      - "${APP_BIND:-127.0.0.1}:${APP_HTTPS_PORT:-8443}:443"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - archivos:/app/storage/app
      - caddy_data:/data
      - caddy_config:/config

  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-depurador}
      POSTGRES_USER: ${DB_USERNAME:-depurador}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env.docker}
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - type: bind
        source: ./database/sql/Esquema_Depurador_Visual.sql
        target: /docker-entrypoint-initdb.d/10-esquema.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./database/sql/Docker_Base_Nueva.sql
        target: /docker-entrypoint-initdb.d/20-baseline.sql
        read_only: true
        bind:
          create_host_path: false

volumes:
  postgres_data:
  archivos:
  caddy_data:
  caddy_config:
