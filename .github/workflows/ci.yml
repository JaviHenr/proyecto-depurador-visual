name: Pruebas del proyecto

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  pruebas:
    name: Laravel, Vue y PostgreSQL
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: depurador_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5433:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d depurador_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5433
      DB_DATABASE: depurador_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v6

      - name: Preparar archivo de entorno
        run: cp .env.example .env

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_pgsql, bcmath, intl, xml
          tools: composer:v2
          coverage: none

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generar clave de Laravel
        run: php artisan key:generate

      - name: Instalar dependencias JavaScript
        run: npm ci

      - name: Compilar Vue e Inertia
        run: npm run build

      - name: Ejecutar migraciones
        run: php artisan migrate:fresh --force

      - name: Ejecutar pruebas Laravel
        run: php artisan test